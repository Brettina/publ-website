<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — publish-Lohr</title>
  <script src="/assets/site.js" defer></script>

  <meta name="description" content="Blog — Artikel zum Aufklappen. Neueste zuerst." />
  <link rel="stylesheet" href="/assets/styles.css?v=2" />
  <link rel="icon" href="/img/webicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/img/webicon.png" />
  <meta name="color-scheme" content="light dark" />

  <style>
    /* Page background — only on this page, not site-wide (homepage and
       webshop have the matching rule in their own <style> blocks). Fixed so
       it doesn't stretch oddly on a long, infinite-scroll post list; dark
       fallback color in case the image is slow/fails to load. */
    body {
      background-color: #0b0c0f;
      background-image: url("/img/bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Layered transparency — TWO tiers (see DOCUMENTATION.md,
       "Transparenz-Hierarchie" for the full rule and history):
       - BRANCH: .section (wraps the whole post list): transparent, 50%.
       - LEAF (holds content directly, nothing further nested inside):
         .page-hero, .note-block, .card/.post (individual blog posts):
         always almost fully opaque, ~0.1% lookthrough.
       Overrides the shared backgrounds from assets/styles.css — scoped to
       this page only via normal cascade order (this <style> loads after
       the shared stylesheet). */
    .section {
      background: color-mix(in srgb, var(--panel) 50%, transparent);
    }
    .page-hero,
    .note-block,
    .card {
      background: color-mix(in srgb, var(--panel) 99.9%, transparent);
    }

    /* Blog-local: simple accordion layout */
    .blog-head {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .blog-controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: end;
      margin-top: 12px;
    }
    @media (min-width: 900px) {
      .blog-controls { grid-template-columns: 1fr 0.7fr; }
    }

    .blog-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .post {
      border-radius: 16px;
      overflow: hidden;
    }

    .post-head {
      padding: 14px 14px 0;
    }

    .post-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
    }

    .post-meta {
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      opacity: 0.9;
      margin-top: 6px;
    }

    .post-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid currentColor;
      font-size: 0.85em;
      opacity: 0.85;
      white-space: nowrap;
    }

    .post-body {
      padding: 12px 14px 14px;
      display: grid;
      gap: 12px;
    }

    .post-cover {
      width: 100%;
      height: clamp(180px, 32vh, 320px);
      object-fit: contain;
      background: rgba(127,127,127,0.08);
      border-radius: 12px;
      display: block;
    }

    .post-content {
      border-radius: 14px;
      padding: 14px;
    }

    .post-content .prose > *:first-child { margin-top: 0; }
    .post-content .prose > *:last-child { margin-bottom: 0; }

    .post-links {
      display: grid;
      gap: 6px;
    }
    .post-links ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }

    .empty {
      opacity: 0.85;
      padding: 14px;
      border-radius: 14px;
      margin-top: 14px;
    }

    /* In-page article modal (for "Mehr zum Buch" / "Vollständigen Artikel
       lesen" links embedded in teaser content — never navigate away to the
       bare, unstyled article.html) */
    .article-modal {
      width: min(760px, calc(100vw - 24px));
      max-height: min(85vh, 900px);
      border: 1px solid rgba(127,127,127,0.45);
      border-radius: 16px;
      padding: 14px 16px 16px;
    }
    .article-modal::backdrop {
      background: rgba(0,0,0,0.55);
    }
    .article-modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .article-modal-body {
      overflow: auto;
      max-height: calc(85vh - 90px);
      margin-top: 12px;
      padding-right: 4px;
    }

    /* Some source articles (Word/PDF conversions) hardcode inline
       color:#000000 on every line. That reads fine on a white page but
       turns invisible in dark mode. Force injected content to follow the
       reader's theme instead of the source document's assumptions. */
    .article-modal-body,
    .article-modal-body * {
      color: inherit !important;
      background: transparent !important;
    }
  </style>
</head>

<body class="page-blog">
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <div id="header-slot"></div>

  <main id="main" class="container">
    <header class="page-hero blog-head">
      <h1>Blog</h1>
      <p class="lead" style="margin:0;">
        Neueste zuerst. Beim Scrollen werden weitere Beiträge nachgeladen.
      </p>

      <div class="blog-controls">
        <div class="field">
          <label for="q">Suche</label>
          <input id="q" type="search" placeholder="Titel / Text durchsuchen…" />
        </div>

        <div class="field">
          <label for="filter">Filter</label>
          <select id="filter">
            <option value="all">Alle</option>
            <option value="books">Bücher</option>
            <option value="articles">Artikel</option>
            <option value="events">Presse</option>
            <option value="calendar">Termine</option>
          </select>
        </div>
      </div>
    </header>

    <section class="section" aria-labelledby="posts-title">
      <h2 id="posts-title">Artikel</h2>
      <div id="posts" class="blog-list" aria-live="polite"></div>
      <div id="scroll-sentinel" aria-hidden="true" style="height:1px;"></div>

      <div id="empty" class="card empty" style="display:none;">
        <p class="fineprint" style="margin:0;">
          Keine Beiträge gefunden. (Wenn alles leer ist: prüfen, ob <code>/assets/work/blog/blog-index.json</code> existiert und Einträge enthält — <code>node assets/tools/generate-blog-feed.mjs</code> ausführen.)
        </p>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <dialog class="article-modal" id="article-modal" aria-label="Artikel">
    <div class="article-modal-head">
      <h3 id="article-modal-title" style="margin:0;"></h3>
      <button class="button button-secondary" type="button" id="article-modal-close">Schließen</button>
    </div>
    <div class="article-modal-body prose" id="article-modal-body"></div>
  </dialog>

  <script>
    const postsEl = document.getElementById("posts");
    const emptyEl = document.getElementById("empty");
    const sentinelEl = document.getElementById("scroll-sentinel");
    const qEl = document.getElementById("q");
    const filterEl = document.getElementById("filter");

    const articleModal = document.getElementById("article-modal");
    const articleModalTitle = document.getElementById("article-modal-title");
    const articleModalBody = document.getElementById("article-modal-body");
    const articleModalClose = document.getElementById("article-modal-close");

    const BATCH_SIZE = 3;

    let allItems = [];   // full feed from blog-index.json, already newest-first
    let visibleCount = BATCH_SIZE;

    const CATEGORY_LABELS = {
      books: "Buch",
      articles: "Artikel",
      events: "Presse",
      calendar: "Termin"
    };

    function norm(s) {
      return (s || "").toString().toLowerCase().trim();
    }

    function escapeHtml(s) {
      return (s || "").toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso || "";
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" });
    }

    async function safeFetchJson(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    async function safeFetchText(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) return null;
        return await res.text();
      } catch {
        return null;
      }
    }

    async function loadFullArticle(contentUrl) {
      const raw = await safeFetchText(contentUrl);
      if (!raw) return "<p class='fineprint'>Konnte den Artikel nicht laden.</p>";
      const doc = new DOMParser().parseFromString(raw, "text/html");
      return doc.body?.innerHTML?.trim() ? doc.body.innerHTML : raw;
    }

    function getFiltered() {
      const q = norm(qEl.value);
      const cat = filterEl.value;

      return allItems.filter(it => {
        if (cat !== "all" && it.sourceCategory !== cat) return false;
        if (!q) return true;
        const hay = norm(`${it.title} ${it.excerpt} ${(it.tags || []).join(" ")}`);
        return hay.includes(q);
      });
    }

    async function openArticleModal(url, title) {
      if (!articleModal) return;
      articleModalTitle.textContent = title || "";
      articleModalBody.innerHTML = "<p class='fineprint'>Lade…</p>";
      if (!articleModal.open) articleModal.showModal();
      articleModalBody.innerHTML = await loadFullArticle(url);
    }

    articleModalClose?.addEventListener("click", () => articleModal.close());
    articleModal?.addEventListener("click", (e) => { if (e.target === articleModal) articleModal.close(); });

    // Teaser content embeds a "Mehr zum Buch" / "Vollständigen Artikel
    // lesen" link back to the real assets/work/<category>/<slug>/article.html.
    // That's a bare, unstyled fragment meant to be embedded, not visited
    // directly — so open it in the modal instead of navigating away.
    function wireInternalLinks(container, item) {
      container.querySelectorAll('a[href^="/assets/work/"]').forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openArticleModal(a.getAttribute("href"), item.title);
        });
      });
    }

    function makePostCard(item) {
      const post = document.createElement("article");
      post.className = "card post";

      const head = document.createElement("div");
      head.className = "post-head";

      const title = document.createElement("h3");
      title.className = "post-title";
      title.textContent = item.title;
      head.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "post-meta";
      meta.appendChild(Object.assign(document.createElement("span"), {
        className: "fineprint", textContent: formatDate(item.date)
      }));
      const catLabel = CATEGORY_LABELS[item.sourceCategory] || "";
      if (catLabel) {
        const pill = document.createElement("span");
        pill.className = "post-pill";
        pill.textContent = catLabel;
        meta.appendChild(pill);
      }
      head.appendChild(meta);

      const body = document.createElement("div");
      body.className = "post-body";

      if (item.cover) {
        const img = document.createElement("img");
        img.className = "post-cover";
        img.loading = "lazy";
        img.alt = item.title || "";
        img.src = item.cover;
        body.appendChild(img);
      }

      const content = document.createElement("div");
      content.className = "post-content prose";
      content.innerHTML = "<p class='fineprint'>Lade…</p>";
      body.appendChild(content);

      loadFullArticle(item.contentUrl).then(html => {
        content.innerHTML = html;
        wireInternalLinks(content, item);
      });

      post.appendChild(head);
      post.appendChild(body);
      return post;
    }

    // Cards auto-load their content, so re-creating already-shown cards on
    // every scroll tick would re-fetch them for nothing. Only append cards
    // for items not yet rendered; a full reset (search/filter change) clears
    // and starts over since the visible set changes entirely anyway.
    let renderedSlugs = new Set();

    function render({ reset = false } = {}) {
      const filtered = getFiltered();
      const visible = filtered.slice(0, visibleCount);

      if (reset) {
        postsEl.innerHTML = "";
        renderedSlugs = new Set();
      }

      visible.forEach(item => {
        if (renderedSlugs.has(item.slug)) return;
        renderedSlugs.add(item.slug);
        postsEl.appendChild(makePostCard(item));
      });

      emptyEl.style.display = filtered.length ? "none" : "block";
      sentinelEl.style.display = visible.length < filtered.length ? "block" : "none";
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) {
        visibleCount += BATCH_SIZE;
        render();
      }
    }, { rootMargin: "400px" });
    observer.observe(sentinelEl);

    [qEl, filterEl].forEach(el => el.addEventListener("input", () => {
      visibleCount = BATCH_SIZE;
      render({ reset: true });
    }));

    (async function init() {
      const data = await safeFetchJson("/assets/work/blog/blog-index.json");
      allItems = Array.isArray(data?.items) ? data.items.slice() : [];
      allItems.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
      render({ reset: true });
    })();
  </script>
</body>
</html>
